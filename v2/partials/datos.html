<!--
  partials/datos.html — datos del responsable (paso 4 del wizard)
  ==========================================================================
  Seis datos y la aceptación del reglamento. Los ids y los data-campo son los
  que espera el backend: {campo}-alo-{clave} y data-campo="{campo}".

  - El celular viaja como prefijo + número (dos campos), pero se lee y se enfoca
    como un solo dato: el grupo lleva role="group" y los controles tienen su
    etiqueta oculta.
  - El DNI va como texto con inputmode="numeric", pattern, maxlength y un
    contador de caracteres en la fila de la etiqueta: se escriben 7 u 8 números
    sin puntos, y las flechas de un number no sirven para un documento.
  - La aceptación es un checkbox real dentro del label, así que el texto también
    marca la casilla; el error, si falta, va debajo (ver .field--invalid en
    components.css).
  - En integración el enlace del reglamento apunta al campo `pdf` del albergue
    que devuelve listarAlbergues. Acá es un placeholder declarado.

  Validación (assets/js/validacion.js)
  --------------------------------------------------------------------------
  Cada campo declara su regla en data-regla y el módulo la aplica: filtra al
  tipear, valida al salir y al confirmar, y marca el campo con .field--invalid
  más el .field__error debajo. Los atributos required, pattern, minlength y
  maxlength quedan como contrato y como respaldo sin script.

     institución   solo letras y números          3 a 80
     responsable   solo letras                    3 a 60
     DNI           7 u 8 dígitos, sin puntos      contador 8
     celular       solo dígitos, sin 0 ni 15      con el área suma 9 o 10
     correo        con arroba y dominio            hasta 120
     aceptación    casilla marcada
-->
<!-- La nota de obligatoriedad va en el encabezado del panel (.paso__head), una
     sola vez para los seis campos. -->
<p class="form__required">Todos los datos son obligatorios.</p>

<form class="paso__form" id="aloFormMaestro" action="reservar.html" method="get">
  <div class="paso__fields">
    <div class="field paso__field--full">
      <label class="field__label" for="institucion-alo-maestro">Institución</label>
      <input
        class="input"
        id="institucion-alo-maestro"
        name="institucion"
        data-campo="institucion"
        type="text"
        placeholder="Escuela o institución"
        autocomplete="organization"
        data-regla="institucion"
        minlength="3"
        maxlength="80"
        aria-describedby="institucion-alo-maestro-ayuda"
        required
      />
      <p class="field__help" id="institucion-alo-maestro-ayuda">Solo letras y números.</p>
    </div>

    <div class="field">
      <label class="field__label" for="responsable-alo-maestro">Responsable del grupo</label>
      <input
        class="input"
        id="responsable-alo-maestro"
        name="responsable"
        data-campo="responsable"
        type="text"
        placeholder="Nombre y apellido"
        autocomplete="name"
        data-regla="nombre"
        minlength="3"
        maxlength="60"
        aria-describedby="responsable-alo-maestro-ayuda"
        required
      />
      <p class="field__help" id="responsable-alo-maestro-ayuda">Solo letras.</p>
    </div>

    <div class="field">
      <div class="field__head">
        <label class="field__label" for="dni-alo-maestro">DNI del responsable</label>
        <span class="field__count" aria-hidden="true"></span>
      </div>
      <input
        class="input"
        id="dni-alo-maestro"
        name="dni"
        data-campo="dni"
        type="text"
        inputmode="numeric"
        data-regla="dni"
        data-contador="8"
        pattern="\d{7,8}"
        minlength="7"
        maxlength="8"
        placeholder="7 u 8 números"
        aria-describedby="dni-alo-maestro-ayuda"
        required
      />
      <p class="field__help" id="dni-alo-maestro-ayuda">Sin puntos ni espacios.</p>
    </div>

    <div class="field" role="group" aria-labelledby="celular-alo-maestro-label">
      <span class="field__label" id="celular-alo-maestro-label">Celular del responsable</span>
      <div class="field__group">
        <label class="visually-hidden" for="prefijo-alo-maestro">Código de área</label>
        <div class="select">
          <select
            class="input select__control"
            id="prefijo-alo-maestro"
            name="prefijo"
            data-campo="prefijo"
          >
            <option value="381">381</option>
            <option value="3865">3865</option>
            <option value="3894">3894</option>
          </select>
          <svg class="icon icon--sm select__chevron" aria-hidden="true">
            <use href="#i-chevron-down"></use>
          </svg>
        </div>
        <label class="visually-hidden" for="numero-alo-maestro">Número</label>
        <input
          class="input"
          id="numero-alo-maestro"
          name="numero"
          data-campo="numero"
          type="tel"
          inputmode="numeric"
          data-regla="celular"
          minlength="5"
          maxlength="7"
          placeholder="5551234"
          autocomplete="tel"
          aria-describedby="celular-alo-maestro-ayuda"
          required
        />
      </div>
      <p class="field__help" id="celular-alo-maestro-ayuda">Solo números, sin 0 ni 15.</p>
    </div>

    <div class="field">
      <label class="field__label" for="email-alo-maestro">Correo electrónico</label>
      <input
        class="input"
        id="email-alo-maestro"
        name="email"
        data-campo="email"
        type="email"
        placeholder="nombre@correo.com"
        autocomplete="email"
        data-regla="email"
        maxlength="120"
        required
      />
    </div>

    <div class="field paso__field--full">
      <label class="checkbox">
        <span class="checkbox__box">
          <input
            class="checkbox__input"
            id="acepta-terminos-alo-maestro"
            name="acepta-terminos"
            data-campo="acepta-terminos"
            type="checkbox"
            data-regla="acepta"
            required
          />
          <svg class="icon checkbox__check" aria-hidden="true">
            <use href="#i-check"></use>
          </svg>
        </span>
        <span class="checkbox__text">
          Leí y acepto el
          <a class="link" href="index.html#ayuda" data-placeholder="reglamento">
            reglamento del albergue
          </a>
          y las condiciones de cancelación.
        </span>
      </label>
    </div>
  </div>
</form>
